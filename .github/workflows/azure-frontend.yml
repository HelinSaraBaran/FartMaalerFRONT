name: Deploy Fartmåler Frontend to Azure

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: FaartmaalerV2Front

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode fra GitHub
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer npm packages
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://DIN-BACKEND.azurewebsites.net/api

      - name: Deploy til Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dist