<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <title>Ny Måling</title>

    <link rel="stylesheet" href="Style.css?v=101">
</head>

<body class="elev-green-page">

<div id="app">

    <div class="measurement-container">

        <div class="measurement-card">

            <div class="header-row">

                <div class="icon-circle">
                    👤
                </div>

                <div>

                    <h1>
                        Start en ny session
                    </h1>

                    <p>
                        Udfyld oplysningerne og gør systemet klar til at registrere målinger
                    </p>

                </div>

            </div>

            <!-- Error message -->
            <div
                v-if="errorMessage"
                class="error-box">

                {{ errorMessage }}

            </div>

            <!-- Gruppe -->
            <label for="groupSelect">
                Gruppe
            </label>

            <select
                id="groupSelect"
                v-model="selectedGroupId">

                <option value="">
                    Vælg gruppe
                </option>

                <option
    v-for="group in groups.filter(function(group) { return group.isLocked !== true; })"
    v-bind:key="group.id"
    v-bind:value="group.id">

                    {{ getGroupDisplayText(group) }}

                </option>

            </select>

            <!-- Biltype -->
            <label for="carTypeSelect">
                Biltype
            </label>

            <select
                id="carTypeSelect"
                v-model="selectedCarType">

                <option value="">
                    Vælg biltype
                </option>

                <option value="Benzin Lille">
                    Benzin - lille
                </option>

                <option value="Benzin Stor">
                    Benzin - stor
                </option>

                <option value="Diesel">
                    Diesel
                </option>

                <option value="Hybrid">
                    Hybrid
                </option>

            </select>

            <!-- Vejtype -->
            <label for="roadTypeSelect">
                Vejtype
            </label>

            <select
                id="roadTypeSelect"
                v-model="selectedRoadType">

                <option value="">
                    Vælg vejtype
                </option>

                <option value="Byzone">
                    Byzone - 50 km/t
                </option>

                <option value="Landevej">
                    Landevej - 80 km/t
                </option>

                <option value="Motorvej">
                    Motorvej - 110 km/t
                </option>

            </select>

            <!-- Start button -->
            <button
                type="button"
                class="start-measure-btn"
                v-on:click="startSession">

                ▶ Start session

            </button>

            <!-- Back button -->
            <button type="button" class="filter-reset" onclick="window.location.href='index.html'">
                ← Tilbage til forsiden
            </button>

            <div class="info-text">
                Du kan ikke starte før gruppe, biltype og vejtype er udfyldt
            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="api.js"></script>
<script src="elev.js?v=100"></script>

</body>

</html>
